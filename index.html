<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語発音判定トレーニング</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background-color: #2c3e50;
            color: white;
        }
        .progress {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .sentence-box {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0 10px 0;
            line-height: 1.4;
            min-height: 60px;
        }
        .jp-box {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .custom-input-area {
            margin: 15px 0;
            display: none;
        }
        .custom-textarea {
            width: 90%;
            height: 90px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #3498db;
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
        }
        .sentence-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 10px 0;
            max-height: 120px;
            overflow-y: auto;
        }
        .sentence-btn {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sentence-btn.active {
            background-color: #e67e22;
            color: white;
            border-color: #d35400;
            font-weight: bold;
        }
        .btn-group {
            margin-bottom: 20px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
            font-weight: bold;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-mic { background-color: #e74c3c; }
        .btn-mic:hover { background-color: #c0392b; }
        .btn-mic.recording {
            background-color: #27ae60;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .result-area {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            text-align: left;
        }
        .score-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .word-analysis {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 15px 0;
            font-size: 20px;
            font-weight: bold;
        }
        .word-tag {
            padding: 4px 8px;
            border-radius: 6px;
        }
        .word-ok {
            color: #27ae60;
            background-color: #e8f8f5;
            border: 1px solid #27ae60;
        }
        .word-ng {
            color: #e74c3c;
            background-color: #fadbd8;
            border: 1px solid #e74c3c;
        }
        .spoken-text {
            font-size: 14px;
            color: #555;
            text-align: center;
            margin-top: 10px;
        }
        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .btn-nav {
            background-color: #bdc3c7;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-preset" onclick="switchMode('preset')">📋 お題リスト</button>
        <button class="tab-btn" id="tab-custom" onclick="switchMode('custom')">✏️ じぶん入力</button>
    </div>

    <div class="progress" id="progress">問題 1 / 12</div>
    
    <div class="sentence-box" id="target-en"></div>
    <div class="jp-box" id="target-jp"></div>

    <div class="custom-input-area" id="custom-area">
        <textarea class="custom-textarea" id="custom-text" placeholder="ここに英文を入力（改行すると複数文を登録できます）" oninput="parseCustomText()"></textarea>
        <div class="sentence-list" id="sentence-list"></div>
    </div>

    <div class="btn-group">
        <button class="btn" onclick="playAudio()">🔊 お手本を聞く</button>
        <button class="btn btn-mic" id="mic-btn" onclick="toggleRecording()">🎤 発音を録音する</button>
    </div>

    <div class="result-area">
        <div class="score-title" id="score-text">マイクボタンを押して発音してください</div>
        <div class="word-analysis" id="word-analysis"></div>
        <div class="spoken-text" id="spoken-text"></div>
    </div>

    <div class="nav-btns" id="nav-group">
        <button class="btn btn-nav" onclick="prevSentence()">前へ</button>
        <button class="btn btn-nav" onclick="nextSentence()">次へ</button>
    </div>
</div>

<script>
const presetSentences = [
    { en: "Where do you want to go?", jp: "どこに行きたいですか？" },
    { en: "I want to go to Australia.", jp: "オーストラリアに行きたいです。" },
    { en: "Let's go to Italy.", jp: "イタリアに行きましょう。" },
    { en: "You can see koalas.", jp: "コアラが見られます。" },
    { en: "You can eat pizza.", jp: "ピザが食べられます。" },
    { en: "You can visit a temple.", jp: "お寺を訪れることができます。" },
    { en: "You can buy a T-shirt.", jp: "Tシャツが買えます。" },
    { en: "What can you see in Africa?", jp: "アフリカでは何が見られますか？" },
    { en: "Why do you want to go to France?", jp: "なぜフランスに行きたいのですか？" },
    { en: "Because I want to visit a museum.", jp: "美術館を訪れたいからです。" },
    { en: "It's a beautiful country.", jp: "美しい国です。" },
    { en: "What can you do in China?", jp: "中国では何ができますか？" }
];

let currentIndex = 0;
let currentMode = 'preset';
let currentTargetText = presetSentences[0].en;

let customSentences = [];
let customIndex = 0;

let recognition = null;
let isRecording = false;

initSpeech();
updateDisplay();

function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        recognition.onstart = function() {
            isRecording = true;
            const btn = document.getElementById('mic-btn');
            btn.classList.add('recording');
            btn.textContent = '🎙️ 聴き取り中...';
            document.getElementById('score-text').textContent = '話が終わると自動で判定します';
            document.getElementById('word-analysis').innerHTML = '';
            document.getElementById('spoken-text').textContent = '';
        };

        recognition.onresult = function(event) {
            const spoken = event.results[0][0].transcript;
            analyzePronunciation(spoken);
        };

        recognition.onerror = function() {
            document.getElementById('score-text').textContent = 'うまく聞き取れませんでした。もう一度短くはっきり発音してください。';
            stopRecording();
        };

        recognition.onend = function() {
            stopRecording();
        };
    }
}

function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tab-preset').className = mode === 'preset' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tab-custom').className = mode === 'custom' ? 'tab-btn active' : 'tab-btn';
    
    if (mode === 'preset') {
        document.getElementById('progress').style.display = 'block';
        document.getElementById('target-jp').style.display = 'block';
        document.getElementById('custom-area').style.display = 'none';
        document.getElementById('nav-group').style.display = 'flex';
        updateDisplay();
    } else {
        document.getElementById('progress').style.display = 'none';
        document.getElementById('target-jp').style.display = 'none';
        document.getElementById('custom-area').style.display = 'block';
        document.getElementById('nav-group').style.display = 'none';
        parseCustomText();
    }
    resetResults();
}

function updateDisplay() {
    currentTargetText = presetSentences[currentIndex].en;
    document.getElementById('progress').textContent = `問題 ${currentIndex + 1} / ${presetSentences.length}`;
    document.getElementById('target-en').textContent = currentTargetText;
    document.getElementById('target-jp').textContent = presetSentences[currentIndex].jp;
    resetResults();
}

function parseCustomText() {
    const rawText = document.getElementById('custom-text').value;
    customSentences = rawText.split('\n').map(s => s.trim()).filter(s => s.length > 0);

    const listContainer = document.getElementById('sentence-list');
    listContainer.innerHTML = '';

    if (customSentences.length === 0) {
        currentTargetText = '（枠内に文章を入力してください）';
        document.getElementById('target-en').textContent = currentTargetText;
    } else {
        if (customIndex >= customSentences.length) customIndex = 0;

        customSentences.forEach((sentence, idx) => {
            const btn = document.createElement('button');
            btn.className = 'sentence-btn' + (idx === customIndex ? ' active' : '');
            btn.textContent = `${idx + 1}. ${sentence}`;
            btn.onclick = () => selectCustomSentence(idx);
            listContainer.appendChild(btn);
        });

        selectCustomSentence(customIndex);
    }
    resetResults();
}

function selectCustomSentence(index) {
    customIndex = index;
    currentTargetText = customSentences[index];
    document.getElementById('target-en').textContent = currentTargetText;

    const btns = document.querySelectorAll('.sentence-btn');
    btns.forEach((btn, idx) => {
        btn.className = 'sentence-btn' + (idx === index ? ' active' : '');
    });
    resetResults();
}

function resetResults() {
    document.getElementById('score-text').textContent = 'マイクボタンを押して発音してください';
    document.getElementById('word-analysis').innerHTML = '';
    document.getElementById('spoken-text').textContent = '';
}

function playAudio() {
    if (currentTargetText.includes('（')) return;
    window.speechSynthesis.cancel();
    const uttr = new SpeechSynthesisUtterance(currentTargetText);
    uttr.lang = 'en-US';
    uttr.rate = 0.8;
    window.speechSynthesis.speak(uttr);
}

function toggleRecording() {
    if (currentTargetText.includes('（')) {
        alert("文章を入力してください");
        return;
    }
    if (!recognition) {
        alert("お使いの環境は音声認識に対応していません。");
        return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true }).then(() => {
        if (isRecording) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
                setTimeout(() => { recognition.start(); }, 200);
            }
        }
    }).catch(err => {
        alert("マイクの使用を許可してください。");
    });
}

function stopRecording() {
    isRecording = false;
    const btn = document.getElementById('mic-btn');
    btn.classList.remove('recording');
    btn.textContent = '🎤 発音を録音する';
}

function analyzePronunciation(spoken) {
    const cleanTarget = currentTargetText.replace(/[?.,!]/g, '').toLowerCase();
    const cleanSpoken = spoken.replace(/[?.,!]/g, '').toLowerCase();

    const targetWords = cleanTarget.split(/\s+/);
    const spokenWords = cleanSpoken.split(/\s+/);

    let matchedCount = 0;
    let analysisHTML = '';

    targetWords.forEach((word, index) => {
        const isMatched = (spokenWords[index] === word);

        if (isMatched) {
            matchedCount++;
            analysisHTML += `<span class="word-tag word-ok">✔ ${word}</span>`;
        } else {
            analysisHTML += `<span class="word-tag word-ng">✖ ${word}</span>`;
        }
    });

    const scorePercent = Math.round((matchedCount / targetWords.length) * 100);
    
    let evaluation = '';
    if (scorePercent === 100) evaluation = '🌟 素晴らしい！完璧な発音です！ (100%)';
    else if (scorePercent >= 80) evaluation = '👍 かなり良いです！もう一息！ (' + scorePercent + '%)';
    else if (scorePercent >= 50) evaluation = '💪 惜しい！単語を意識してみよう (' + scorePercent + '%)';
    else evaluation = '⚠️ 正確に聞き取れませんでした。 (' + scorePercent + '%)';

    document.getElementById('score-text').textContent = evaluation;
    document.getElementById('word-analysis').innerHTML = analysisHTML;
    document.getElementById('spoken-text').textContent = `（認識された音声: "${spoken}"）`;
}

function nextSentence() {
    currentIndex = (currentIndex + 1) % presetSentences.length;
    updateDisplay();
}

function prevSentence() {
    currentIndex = (currentIndex - 1 + presetSentences.length) % presetSentences.length;
    updateDisplay();
}
</script>

</body>
</html>
